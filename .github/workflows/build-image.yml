name: Build and push image

# Builds the Docker image for linux/amd64 (the server is x86_64) and pushes it to
# GHCR as ghcr.io/hmontazeri/lottobot:<branch>. The Coolify app is set to that
# image name (pull mode), so it pulls this image and skips its own build. After the
# push the workflow triggers the Coolify deploy for the app.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/hmontazeri/lottobot:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy
        env:
          COOLIFY_SECRET_KEY: ${{ secrets.COOLIFY_SECRET_KEY }}
        if: ${{ env.COOLIFY_SECRET_KEY != '' }}
        run: |
          TOKEN=$(node -e '
          const c = require("crypto");
          const s = process.env.COOLIFY_SECRET_KEY;
          const b = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
          const now = Math.floor(Date.now() / 1000);
          const h = b({ alg: "HS256", typ: "JWT" });
          const p = b({ teamId: "0", iat: now, exp: now + 300 });
          const sig = c.createHmac("sha256", s).update(h + "." + p).digest("base64url");
          process.stdout.write(h + "." + p + "." + sig);
          ')
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" -d '{}' \
            "https://apps.hmontazeri.me/api/v1/applications/cm6qa1vqw00q0roa51macmwfk/deploy"
